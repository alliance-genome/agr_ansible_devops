---
# tasks file for setup_nvme_drives
# This runs BEFORE Docker is configured, so Docker should be clean/empty

- name: Stop Docker service if running
  systemd:
    name: docker.service
    state: stopped
  ignore_errors: yes

- name: Stop Docker socket if exists
  systemd:
    name: docker.socket
    state: stopped
  ignore_errors: yes

- name: Wait a moment for Docker to stop
  pause:
    seconds: 3

- name: Unmount any existing mounts in /var/lib/docker
  shell: |
    for mount in $(mount | grep '/var/lib/docker' | awk '{print $3}' | sort -r); do
      umount -l "$mount" || true
    done
  ignore_errors: yes

- name: Delete directory
  file:
    path: "/var/lib/docker"
    state: absent

- name: Create directory
  file:
    path: "/var/lib/docker"
    state: directory
    owner: "root"
    group: "root"
    mode: "711"

- name: Create Raid
  command: mdadm --create --verbose --auto=yes /dev/md0 --level=0 --raid-devices=2 /dev/nvme1n1 /dev/nvme2n1

- name: Create Partitions
  shell: echo -e "p\nn\np\n1\n\n\nw" | fdisk /dev/md0

- name: Create File System
  command: mkfs.ext4 -F /dev/md0p1

- name: Mount Raid AS docker FS
  mount:
    src: /dev/md0p1
    path: /var/lib/docker
    state: mounted
    fstype: ext4

- name: Start Docker
  command: systemctl start docker.service
