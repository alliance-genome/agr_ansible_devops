- name: Pull QC Run Image
  shell: docker pull {{ QC_RUN_IMAGE }} 2>&1

- name: Run QC
  docker_container:
    name: "{{ QC_RUN_NAME }}"
    image: "{{ QC_RUN_IMAGE }}"
    detach: no
    log_driver: "gelf"
    log_options:
      gelf-address: "{{ LOG_SERVER_ADDRESS }}"
    network_mode: "{{ NET }}"
    env:
      NEO4J_HOST: "{{ NEO_SERVER_NAME }}"
