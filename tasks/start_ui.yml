---

- name: Pull UI Server Image
  shell: docker pull {{ UI_SERVER_IMAGE }} 2>&1

- name: Run UI
  docker_container:
    name: "{{ UI_SERVER_NAME }}"
    image: "{{ UI_SERVER_IMAGE }}"
    log_driver: "gelf"
    log_options:
      gelf-address: "{{ LOG_SERVER_ADDRESS }}"
    network_mode: "{{ NET }}"
    env:
      API_URL: "http://{{ API_SERVER_NAME }}:8080"
