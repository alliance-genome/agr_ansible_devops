- name: Pull Intermine Postgres Data Image
  shell: docker pull {{ INTERMINE_POSTGRES_SERVER_IMAGE }} 2>&1

- name: Start Postgres
  docker_container:
    name: "{{ INTERMINE_POSTGRES_SERVER_NAME }}"
    image: "{{ INTERMINE_POSTGRES_SERVER_IMAGE }}"
    log_driver: "gelf"
    log_options:
      gelf-address: "{{ LOG_SERVER_ADDRESS }}"
    ports:
      - "5432:5432"
    network_mode: "{{ NET }}"
    env:
      PGDATA: /var/lib/postgresql/alliancedata

- pause:
    minutes: 2
